alerts:
  - name: HighLatencyP95
    severity: P2
    condition: 'p95(latency_ms where event == "response_sent") > 3000 over 5m window'
    duration: 5m
    type: symptom-based
    slo: fast_successful_requests
    channel: slack
    slack_channel: '#day13-l3a-alerts'
    owner: LeDucTung
    runbook: docs/alerts.md#alert-1

  - name: HighErrorRate
    severity: P1
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 > 2 over 5m window OR retrieval success rate (tool_success) < 90%'
    duration: 5m
    type: symptom-based
    slo: fast_successful_requests
    channel: slack
    slack_channel: '#day13-l3a-alerts'
    owner: LeDucTung
    runbook: docs/alerts.md#alert-2

  - name: CostBurnRateHigh
    severity: P3
    condition: 'sum(cost_usd where event == "response_sent") over 1h > 0.104 (projects > 2.5 USD/day guardrail)'
    duration: 15m
    type: symptom-based
    slo: guardrails.daily_cost_usd_max
    channel: slack
    slack_channel: '#day13-l3a-alerts'
    owner: LeDucTung
    runbook: docs/alerts.md#alert-3
